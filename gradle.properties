#=========================================================================
# HYPERNEXUS - OPTIMIZACIÓN GLOBAL DEL COMPILADOR GRADLE
#=========================================================================

# 1. Inyección obligatoria de 3GB de RAM dedicados a la JVM
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# 2. Compilación a la velocidad de la luz (Paralelo y Caché)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 3. Soporte moderno AndroidX y traducción de librerías antiguas
android.useAndroidX=true
android.enableJetifier=true

# 4. Optimización de rendimiento del demonio de compilación
org.gradle.daemon=true

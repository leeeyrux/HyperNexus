name: Build HyperNexus APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    
    - name: Build Debug APK
      run: JAVA_OPTS="" ./gradlew assembleDebug --stacktrace


    
    - name: Build Release APK
      run: JAVA_OPTS="" ./gradlew assembleRelease --stacktrace


    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HyperNexus-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: HyperNexus-Release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
    
    - name: Upload Mapping (Release)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mapping-release
        path: app/build/outputs/mapping/release/mapping.txt
        retention-days: 30

name: Build HyperNexus APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v3

    - name: Configurar Entorno Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Conceder Permisos de Ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK de Producción con R8 Podadora
      run: ./gradlew assembleDebug --no-daemon

    - name: Subir APK Final como Artefacto Descargable
      uses: actions/upload-artifact@v3
      with:
        name: HyperNexus-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
